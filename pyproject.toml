[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polyalign-data"
version = "0.1.0"
description = "Dataset preprocessing and scope-freeze tooling for PolyAlign."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "datasets>=3.0.0",
  "huggingface_hub>=0.25.0",
]

[project.scripts]
polyalign-data = "polyalign_data.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
