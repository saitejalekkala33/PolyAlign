### model
model_name_or_path: saves/qwen25-3b-sft-zh
trust_remote_code: true

### method
stage: dpo
do_train: true
do_eval: true
finetuning_type: full
pref_beta: 0.1
pref_loss: sigmoid
deepspeed: examples/deepspeed/ds_z3_config.json

### dataset
dataset_dir: data
dataset: qwen25_3b_train_dpo_zh
eval_dataset: qwen25_3b_val_dpo_zh
template: qwen
cutoff_len: 4096
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/qwen25-3b-dpo-zh
logging_steps: 10
save_steps: 3000
eval_steps: 3000
plot_loss: true
overwrite_output_dir: true
save_only_model: false
save_total_limit: 3
report_to: wandb
run_name: qwen25-3b-dpo-zh

### train
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 5.0e-7
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
max_grad_norm: 1.0
bf16: true
fp16: false
ddp_timeout: 180000000
resume_from_checkpoint: null

### eval
eval_strategy: steps
load_best_model_at_end: false
metric_for_best_model: eval_rewards/accuracies
greater_is_better: true
